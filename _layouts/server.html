{% assign t = site.data.i18n[page.lang] %}
<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
  {% include site-head.html %}
</head>
<body>
  {% include site-header.html %}
  <main id="main">
    <section class="wrap section server-hero">
      <p class="kicker">{{ t.server_kicker }}</p>
      <h1>{{ t.server_title }}</h1>
      <p class="lead">{{ t.server_lead }}</p>
    </section>

    <section class="wrap section">
      <div class="cards">
        {% for item in t.server_points %}
          <article class="card">
            <h3>{{ item.title }}</h3>
            <p>{{ item.body }}</p>
          </article>
        {% endfor %}
      </div>
    </section>
  </main>
  {% include site-footer.html %}
</body>
</html>
