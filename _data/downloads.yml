# Intermediate CI builds from TorgLink (workflow: CI / _ci_targets.yml).
#
# source:
#   actions  — link to successful CI runs; ZIP download needs any GitHub login
#              (even on public repos). Run pages are publicly viewable.
#   releases — anonymous browser_download_url from the rolling `ci-builds`
#              prerelease (softprops in TorgLink ci.yml). Links 404 until the
#              first green CI push publishes that prerelease.
source: releases
ci_workflow_url: https://github.com/IskraMessenger/TorgLink/actions/workflows/ci.yml
ci_success_url: https://github.com/IskraMessenger/TorgLink/actions/workflows/ci.yml?query=is%3Asuccess
ci_runs_api: https://api.github.com/repos/IskraMessenger/TorgLink/actions/workflows/ci.yml/runs?status=success&per_page=1
release_tag: ci-builds
release_url: https://github.com/IskraMessenger/TorgLink/releases/tag/ci-builds
release_download_base: https://github.com/IskraMessenger/TorgLink/releases/download/ci-builds
# Server: ShortP2P 0.1 download buttons open the Actions run artifacts section.
# Unstable CI stays on the workflow list (server_actions_url).
server_release_tag: "0.1"
server_release_url: https://github.com/IskraMessenger/ShortP2P/actions/runs/36399809396#artifacts
server_actions_url: https://github.com/IskraMessenger/ShortP2P/actions
# Homepage Platforms cards: which artifact drop to open (no Linux/iOS client builds).
platform_artifacts:
  windows: client
  android: client
# A build may carry `url` to pin it to one Actions run instead of the rolling
# release asset; that link wins over both source modes and is left alone by
# assets/js/ci-downloads.js. WinForms x86/x64 ship in one `winforms-Release`
# artifact, so both entries point at the same run.
builds:
  - id: winforms-x86
    label: WinForms x86
    artifact: winforms-Release
    asset: TorgLink-0.1-winforms-x86-setup.exe
    url: https://github.com/IskraMessenger/TorgLink/actions/runs/36701754190#artifacts
  - id: winforms-x64
    label: WinForms x64
    artifact: winforms-Release
    asset: TorgLink-0.1-winforms-x64-setup.exe
    url: https://github.com/IskraMessenger/TorgLink/actions/runs/36701754190#artifacts
  - id: maui-windows-x64
    label: MAUI Windows x64
    artifact: maui-windows-x64-Release
    asset: TorgLink-0.1-win10-x64-setup.exe
  - id: android-arm64
    label: Android arm64
    artifact: apk-android-arm64-Release
    asset: apk-android-arm64-Release.zip
