  hero_lead: "TorgLink 是一款结合客户端-服务器与网状（mesh）两种方式的即时通讯应用：可以在两者之间切换，也可以同时使用。服务器可以有多台，可部署在 Windows 或 Linux 设备上。应用本身跨平台：Windows、Linux、Android 和 iOS。"
  cta_source: 查看代码
  cta_branch: "分支 dev/0.1"
  phone_peer: 莉娜
  phone_status: 2 跳 · UDP
  phone_in: 网状网络那边听得到吗？
  phone_out: 消息已收到。
  phone_meta: 经中继
  mesh_you: 你
  mesh_lan: 局域网
  mesh_peer: 对端
  mesh_relay: 中继
  mesh_server: 服务器
  features_kicker: 它能做什么
  features_title: Mesh (and/or) server
  features:
    - title: 点对点优先
      body: 通过 UDP 在局域网发现对端，若已知地址则直接发送。
    - title: 短距离网状网络
      body: 没有直达路由时，TorgLink 在小图上搜索——1 到 3 跳——并可通过已信任的节点中继。
    - title: 需要时使用 BLE
      body: 低功耗蓝牙（BLE）可承载同一加密会话。
    - title: 对服务器不透明
      body: 可选的 HTTPS 服务器只存储密文。它转发数据块、回执和在线状态，不阅读聊天内容。
    - title: 账号留在本机
      body: 注册和聊天保存在设备上。用二维码添加联系人。身份识别不需要电话号码、电子邮件等任何此类数据。
    - title: 跨平台
      body: 应用可在 Windows、Linux、Android 和 iOS 上运行。服务器可部署在 Windows 或 Linux。
  how_kicker: 消息如何走
  how_title: 消息传递的四种方式。
  steps:
    - n: "01"
      title: 直达
      body: 上次已知的 UDP 地址、同一局域网，或扫码得到的对端。
    - n: "02"
      title: 中继
      body: 短节点链（最多 1–3 跳）剥离并转发数据包。
    - n: "03"
      title: BLE
      body: 低功耗蓝牙（BLE）传输，在无线电比网络更近时使用同一会话。
    - n: "04"
      title: 服务器
      body: 如果无人可达，服务器保存密封载荷，直到对方取走。服务器由网络中的客户端自行部署。
  platforms_kicker: 平台
  platforms_title: 可用于以下平台
  platforms_note: 我们尽量支持广泛的设备，包括如今被视为过时的设备（Windows 7）。
  platforms:
    - name: Windows
      detail: 客户端，含 Windows 7。也可在此部署服务器。
    - name: Linux
      detail: 客户端；也可在此部署服务器。
    - name: Android
      detail: 客户端。
    - name: iOS
