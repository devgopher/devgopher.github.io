  how_title: Quatre façons de faire circuler une étincelle.
  steps:
    - n: "01"
      title: Direct
      body: Dernière adresse UDP connue, même LAN, ou pair scanné par QR.
    - n: "02"
      title: Relais
      body: Une courte chaîne de nœuds (max. 1–3 sauts) retire les enveloppes et transmet le paquet.
    - n: "03"
      title: BLE
      body: Transport Bluetooth Low Energy pour la même session lorsque la radio bat le réseau.
    - n: "04"
      title: Store-and-forward
      body: Si personne n’est joignable, le serveur garde la charge scellée jusqu’à ce que l’autre côté la récupère.
