  features_kicker: Qué hace
  features_title: Mesh (and/or) server
  features:
    - title: Primero punto a punto
      body: Descubre pares en la red local por UDP y envía en directo cuando conoce una dirección.
    - title: Malla corta
      body: Si no hay ruta directa, TorgLink busca en un grafo pequeño — de uno a tres saltos — y puede retransmitir por nodos que ya conoce.
    - title: BLE, cuando ayuda
      body: Bluetooth Low Energy puede llevar las mismas sesiones cifradas por radio.
    - title: Opaco en el servidor
      body: El servidor HTTPS opcional guarda solo texto cifrado. Reenvía blobs, acuses y presencia. No lee los chats.
    - title: Cuenta en el dispositivo
      body: El registro y los chats viven en el aparato. Se añade gente con un código QR. No se necesitan datos como número de teléfono, correo electrónico u otros para identificarse.
    - title: Multiplataforma
      body: El mensajero corre en Windows, Linux, Android e iOS. Los servidores se despliegan en Windows o Linux.
  how_kicker: Cómo viaja un mensaje
  how_title: Cuatro modos de mover un mensaje.
  steps:
    - n: "01"
      title: Directo
      body: Última dirección UDP conocida, la misma LAN o un par leído por QR.
    - n: "02"
      title: Relevo
      body: Una cadena corta de nodos (máximo 1–3 saltos) recorta y reenvía el paquete.
    - n: "03"
      title: BLE
      body: Transporte Bluetooth Low Energy para la misma sesión cuando la radio gana a la red.
    - n: "04"
      title: Servidor
      body: Si nadie está al alcance, el servidor guarda el payload sellado hasta que el otro lado lo recoja. Los servidores los despliegan de forma independiente los clientes de la red.
  platforms_kicker: Plataformas
  platforms_title: Disponible en estas plataformas
  platforms_note: Procuramos dar soporte a una amplia gama de dispositivos, incluidos los que hoy se consideran obsoletos (Windows 7).
  platforms:
    - name: Windows
      detail: Cliente, incluido Windows 7. También puedes desplegar un servidor.
    - name: Linux
      detail: Cliente; también puedes desplegar un servidor.
    - name: Android
      detail: Cliente.
    - name: iOS
      detail: Cliente.
  source_kicker: Código
  source_title: TorgLink es el producto. ShortP2P es el protocolo.
  source_body: La app MAUI está en Iskra.MAUI. La malla, la criptografía, el discovery y el servidor opcional viven en el árbol ShortP2P. Este sitio es un borrador de landing para la rama 0.1, no un anuncio de lanzamiento.
