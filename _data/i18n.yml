  features:
    - title: Сначала напрямую
      body: Находит участников в локальной сети по UDP и отправляет напрямую, если известен адрес.
    - title: Короткая ячеистая сеть
      body: Нет прямого маршрута — ищет по небольшому графу (1–3 узла) и может передавать через уже знакомые узлы.
    - title: BLE, когда он к месту
      body: Bluetooth Low Energy может нести тот же зашифрованный сеанс по радио.
    - title: Сервер как передающее звено
      body: Необязательный сервер хранит только шифротекст. Передаёт пакеты, квитанции и сведения о присутствии. Переписку не читает.
    - title: Учётная запись на устройстве
      body: Регистрация и чаты хранятся на устройстве. Людей добавляете по QR-коду. Для идентификации не требуются никакие данные вроде номера телефона, электронной почты и прочего.
    - title: Несколько платформ
      body: Приложение работает на Windows, Linux, Android и iOS. Серверы можно развернуть на Windows или Linux.
