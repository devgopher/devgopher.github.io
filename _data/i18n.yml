  features_kicker: Ce qu’elle fait
  features_title: Mesh (and/or) server
  features:
    - title: Pair à pair d’abord
      body: Découvre les pairs sur le réseau local en UDP et envoie directement lorsqu’une adresse est connue.
    - title: Mesh court
      body: S’il n’y a pas de route directe, TorgLink cherche dans un petit graphe — un à trois sauts — et peut relayer via des nœuds déjà de confiance.
    - title: BLE, quand c’est utile
      body: Le Bluetooth Low Energy peut porter les mêmes sessions chiffrées par radio.
    - title: Opaque sur le serveur
      body: Le serveur HTTPS optionnel ne stocke que du texte chiffré. Il transmet blobs, accusés et présence. Il ne lit pas les chats.
    - title: Compte d’abord local
      body: L’inscription et les chats restent sur l’appareil. On ajoute des contacts avec un QR code. Aucune donnée telle qu’un numéro de téléphone, un e-mail ou similaire n’est requise pour l’identification.
    - title: Multiplateforme
      body: La messagerie tourne sous Windows, Linux, Android et iOS. Les serveurs peuvent être déployés sous Windows ou Linux.
  how_kicker: Comment voyage un message
  how_title: Quatre façons de faire circuler un message.
  steps:
    - n: "01"
      title: Direct
      body: Dernière adresse UDP connue, même LAN, ou pair scanné par QR.
    - n: "02"
      title: Relais
      body: Une courte chaîne de nœuds (max. 1–3 sauts) retire les enveloppes et transmet le paquet.
    - n: "03"
      title: BLE
      body: Transport Bluetooth Low Energy pour la même session lorsque la radio bat le réseau.
    - n: "04"
      title: Serveur
      body: Si personne n’est joignable, le serveur garde la charge scellée jusqu’à ce que l’autre côté la récupère. Les serveurs sont déployés de façon indépendante par les clients du réseau.
