  quickstart_app_kicker: Dans l’app
  quickstart_app_title: Configurer les serveurs dans l’app
  quickstart_app_lead: "Une fois le client lancé, ajoutez l’URL de base de votre serveur ShortP2P. L’app enregistre l’empreinte du certificat du serveur."
  quickstart_app_maui_note: "Les captures sombres viennent du client MAUI sous Windows. Android utilise la même interface MAUI ; il n’y a pas de mise en page Android distincte sur ces images."
  quickstart_app_android_title: Android
  quickstart_app_android_steps:
    - Ouvrez Network.
    - Appuyez sur Servers.
    - Saisissez la Base URL (par exemple https://host:7196).
    - Appuyez sur Add server. Import server est facultatif.
  quickstart_app_maui_title: Win MAUI
  quickstart_app_maui_steps:
    - Ouvrez Network.
    - Appuyez sur Servers.
    - Saisissez la Base URL (par exemple https://host:7196).
    - Appuyez sur Add server. Import server est facultatif.
  quickstart_app_winforms_title: WinForms — pour les PC et versions Windows plus anciens (à partir de Windows 7 SP1)
  quickstart_app_winforms_steps:
    - Ouvrez l’onglet Servers (Серверы).
    - Saisissez la Base URL.
    - Cliquez sur Add (Добавить). Vous pouvez aussi importer un QR depuis un fichier (QR из файла).
