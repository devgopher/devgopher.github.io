  features_kicker: Qué hace
  features_title: Mesh (and/or) server
  features:
    - title: Primero punto a punto
      body: Descubre pares en la red local por UDP y envía en directo cuando conoce una dirección.
    - title: Malla corta
      body: Si no hay ruta directa, TorgLink busca en un grafo pequeño — de uno a tres saltos — y puede retransmitir por nodos que ya conoce.
    - title: BLE, cuando ayuda
      body: Bluetooth Low Energy puede llevar las mismas sesiones cifradas por radio.
    - title: Opaco en el servidor
      body: El servidor HTTPS opcional guarda solo texto cifrado. Reenvía blobs, acuses y presencia. No lee los chats.
    - title: Cuenta en el dispositivo
      body: El registro y los chats viven en el aparato. Se añade gente con un código QR. No se necesitan datos como número de teléfono, correo electrónico u otros para identificarse.
    - title: Multiplataforma
      body: El mensajero corre en Windows, Linux, Android e iOS. Los servidores se despliegan en Windows o Linux.
  server_kicker: Arquitectura
  server_title: Servidor
  server_lead: "Un servidor store-and-forward para encontrar clientes y entregar mensajes cifrados de forma fiable. Los mensajes se guardan exclusivamente cifrados y se borran de forma permanente e irreversible tras su recepción."
  server_points:
    - title: Encontrar clientes
      body: Ayuda a los pares a descubrirse cuando no hay una ruta mesh directa.
    - title: Solo texto cifrado
      body: En el servidor los mensajes viven solo como texto cifrado. No lee los chats.
    - title: Borrado tras la recepción
      body: Cuando la otra parte ha recibido el mensaje, se elimina de forma permanente e irreversible.
  server_cta_release: Lanzamiento 0.1
  server_cta_release_note: ShortP2P · primer lanzamiento publicado
  server_cta_ci: Builds CI inestables
  server_cta_ci_note: GitHub Actions · no es un lanzamiento de producción
