      body: Последний UDP-адрес, та же локальная сеть или участник с QR-кода.
    - n: "02"
      title: Ретрансляция
      body: Короткая цепочка узлов (не больше 1–3) снимает заголовок и передаёт пакет дальше.
    - n: "03"
      title: BLE
      body: Передача по Bluetooth Low Energy для того же сеанса, когда радио ближе, чем сеть.
    - n: "04"
      title: Хранение и пересылка
      body: Если никто не отвечает, сервер держит запечатанное содержимое, пока вторая сторона его не заберёт.
  platforms_kicker: Платформы
  platforms_title: Доступен для платформ
  platforms_note: Мы стараемся поддерживать широкий спектр устройств, в том числе те, что сегодня считают устаревшими (Windows 7).
  platforms:
    - name: Windows
      detail: Клиент, в том числе Windows 7. Здесь также можно развернуть сервер.
    - name: Linux
      detail: Клиент. Здесь также можно развернуть сервер.
    - name: Android
      detail: Клиент.
    - name: iOS
      detail: Клиент.
  source_kicker: Исходники
  source_title: Iskra — продукт. ShortP2P — протокол.
  source_body: Клиент MAUI — в Iskra.MAUI. Ячеистая сеть, шифрование, обнаружение узлов и необязательный сервер — в дереве ShortP2P. Этот сайт — черновик лендинга для ветки 0.1, а не анонс выпуска.
  disclaimer_title: Честные ограничения
  disclaimer_body: Это исследовательский и демонстрационный код. Глубина ячеистой сети, размеры ключей и пределы пакетов экспериментальные. Не воспринимайте 0.1 как боевую модель угроз и не отправляйте сведения, которые нельзя потерять.
