  how_title: Четыре способа доставить сообщение.
  steps:
    - n: "01"
      title: Напрямую
      body: Последний UDP-адрес, та же локальная сеть или участник с QR-кода.
    - n: "02"
      title: Ретрансляция
      body: Короткая цепочка узлов (не больше 1–3) снимает заголовок и передаёт пакет дальше.
    - n: "03"
      title: BLE
