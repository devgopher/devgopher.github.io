    - title: Короткая ячеистая сеть
      body: Нет прямого маршрута — ищет по небольшому графу (1–3 узла) и может передавать через уже знакомые узлы.
    - title: BLE, когда он к месту
      body: Bluetooth Low Energy может нести тот же зашифрованный сеанс по радио.
