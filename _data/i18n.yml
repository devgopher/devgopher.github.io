  server_points:
    - title: 查找客户端
      body: 没有直达网状路径时，帮助对端互相发现。
    - title: 仅密文
      body: 服务器上的消息只以密文存在。它不阅读聊天内容。
    - title: 收到即删
      body: 对方收到消息后，立即永久、不可恢复地删除。
