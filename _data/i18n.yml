    - Does not control, administer, or have access to servers that users may deploy on their own.
    - Is not responsible for users' choices, their actions, or the compliance of their local servers with the requirements of local legislation.
    - Use of the code and the built applications is the sole responsibility of the end user — at their own risk.
  footer_product: TorgLink
  footer_protocol: Protocol ShortP2P
  footer_draft: Landing draft · not a release

