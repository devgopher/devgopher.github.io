  mesh_peer: peer
  mesh_relay: relay
  mesh_server: server
  features_kicker: What it does
  features_title: Mesh (and/or) server
  features:
    - title: Peer-to-peer first
      body: Discovers peers on the local network over UDP and sends directly when an address is known.
    - title: Short mesh
      body: If there is no direct route, TorgLink searches a small graph — one to three hops — and may relay through nodes it already trusts.
    - title: BLE, when it helps
      body: Bluetooth Low Energy can carry the same encrypted sessions over radio.
    - title: Opaque on the server
      body: The optional HTTPS server stores ciphertext only. It forwards blobs, receipts, and presence. It does not read chats.
    - title: Local-first account
      body: Registration and chats live on the device. Add people with a QR code. No data such as a phone number, email, or similar is required for identification.
    - title: Cross-platform
      body: The messenger runs on Windows, Linux, Android, and iOS. Servers can be deployed on Windows or Linux.
  server_kicker: Architecture
  server_title: Server
  server_lead: "A store-and-forward server for finding clients and delivering encrypted messages reliably. Messages are stored exclusively in encrypted form and are permanently deleted after they are received."
  server_points:
    - title: Find clients
      body: Helps peers discover each other when a direct mesh path is missing.
    - title: Ciphertext only
      body: Messages live on the server only as ciphertext. The server does not read chats.
    - title: Deleted after receipt
      body: Once the other side has received the message, it is permanently and irreversibly deleted.
  server_cta_release: Release 0.1
  server_cta_release_note: ShortP2P · first published release
  server_cta_ci: Unstable CI builds
  server_cta_ci_note: GitHub Actions · not a production release
  server_downloads_kicker: Download
  server_downloads_title: Release 0.1
  server_downloads_lead: "First published ShortP2P server release. Open the 0.1 artifacts for Windows and Linux."
  server_downloads_open: Open release 0.1 artifacts
  server_downloads_note: "Windows (win-x64) and Linux (amd64) packages are artifacts of the 0.1 release run. Downloading the ZIP requires any GitHub account."
  server_downloads_ci: Unstable CI builds
  how_kicker: How a message travels
  how_title: Four ways a message can move.
  steps:
    - n: "01"
      title: Direct
      body: Last known UDP address, same LAN, or a scanned QR peer.
    - n: "02"
      title: Relay
      body: A short chain of nodes (max 1–3 hops) strips and forwards the packet.
    - n: "03"
      title: BLE
      body: Bluetooth Low Energy transport for the same session when radio range beats the network.
    - n: "04"
      title: Server
      body: If nobody is reachable, the server keeps the sealed payload until the other side polls. Servers are deployed independently by the network’s clients.
