  how_kicker: Wie eine Nachricht wandert
  how_title: Vier Wege, wie eine Nachricht sich bewegen kann.
  steps:
    - n: "01"
      title: Direkt
      body: Zuletzt bekannte UDP-Adresse, dasselbe LAN oder ein per QR gescannter Peer.
    - n: "02"
      title: Relay
      body: Eine kurze Kette von Knoten (max. 1–3 Hops) entfernt Hüllen und leitet das Paket weiter.
    - n: "03"
      title: BLE
      body: Bluetooth-Low-Energy-Transport für dieselbe Sitzung, wenn Funkreichweite das Netz schlägt.
    - n: "04"
      title: Server
      body: Ist niemand erreichbar, behält der Server die versiegelte Nutzlast, bis die andere Seite abruft. Server werden von den Clients des Netzwerks eigenständig bereitgestellt.
