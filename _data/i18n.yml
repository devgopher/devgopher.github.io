  quickstart_server_lead: "Serveur store-and-forward optionnel. Vous l’hébergez vous-même sous Windows ou Linux. Les messages restent chiffrés et sont supprimés après réception."
  quickstart_server_steps:
    - Ouvrez les artefacts ShortP2P 0.1 sur l’exécution GitHub Actions.
    - Téléchargez le ZIP Windows (win-x64) ou Linux (amd64). Un compte GitHub est requis pour les artefacts Actions.
    - Décompressez l’archive sur la machine hôte et lancez le serveur.
