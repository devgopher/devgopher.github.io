  channel_draft: Draft
  channel_stable: Stable
  hero_kicker: Horizontal connections matters!
  hero_title: Reliability, resilience, security.
  hero_lead: "TorgLink is a messenger that combines client–server and mesh approaches: you can switch between them or use them together. You can run several servers, deployed on Windows or Linux. The messenger itself is cross-platform: Windows, Linux, Android, and iOS."
  cta_source: View the code
  cta_branch: "Branch dev/0.1"
  phone_peer: Lena
  phone_status: 2 hops · UDP
  phone_in: Can you hear me over the mesh?
  phone_out: Message received.
  phone_meta: via relay
  mesh_you: you
  mesh_lan: LAN
  mesh_peer: peer
  mesh_relay: relay
  mesh_server: server
  features_kicker: What it does
  features_title: Mesh (and/or) server
  features:
    - title: Peer-to-peer first
      body: Discovers peers on the local network over UDP and sends directly when an address is known.
    - title: Short mesh
      body: If there is no direct route, TorgLink searches a small graph — one to three hops — and may relay through nodes it already trusts.
    - title: BLE, when it helps
      body: Bluetooth Low Energy can carry the same encrypted sessions over radio.
    - title: Opaque on the server
      body: The optional HTTPS server stores ciphertext only. It forwards blobs, receipts, and presence. It does not read chats.
    - title: Local-first account
      body: Registration and chats live on the device. Add people with a QR code. No data such as a phone number, email, or similar is required for identification.
    - title: Cross-platform
      body: The messenger runs on Windows, Linux, Android, and iOS. Servers can be deployed on Windows or Linux.
  how_kicker: How a message travels
  how_title: Four ways a message can move.
  steps:
    - n: "01"
      title: Direct
      body: Last known UDP address, same LAN, or a scanned QR peer.
    - n: "02"
      title: Relay
      body: A short chain of nodes (max 1–3 hops) strips and forwards the packet.
    - n: "03"
      title: BLE
      body: Bluetooth Low Energy transport for the same session when radio range beats the network.
    - n: "04"
      title: Server
      body: If nobody is reachable, the server keeps the sealed payload until the other side polls. Servers are deployed independently by the network’s clients.
  platforms_kicker: Platforms
  platforms_title: Available on these platforms
  platforms_note: We aim to support a wide range of devices, including ones that are considered outdated today (Windows 7).
  platforms:
    - name: Windows
      detail: Client, including Windows 7. You can also host a server here.
    - name: Linux
      detail: Client. You can also host a server here.
    - name: Android
      detail: Client.
    - name: iOS
      detail: Client.
  source_kicker: Source
  source_title: TorgLink is the product. ShortP2P is the protocol.
  source_body: The MAUI app lives in Iskra.MAUI. Mesh, crypto, discovery, and the optional messenger server live in the ShortP2P tree. This site is a landing draft for branch 0.1 — not a shipping announcement.
  disclaimer_title: Early stage
  disclaimer_body: The project is in an early stage of development.
  legal_title: Disclaimer (Limitation of Liability)
  legal_p1: This project was created for personal, non-commercial, and educational purposes as a demonstration of the technical capabilities of decentralized/hybrid networks and encryption.
  legal_p2: "The software (code) is distributed under an Open Source license \"as is\" (AS-IS), without warranties of any kind."
  legal_dev_title: "The developer (an individual):"
  legal_points:
