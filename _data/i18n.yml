    - title: Учётная запись на устройстве
      body: Регистрация и чаты хранятся на устройстве. Людей добавляете по QR-коду. Для идентификации не требуются никакие данные вроде номера телефона, электронной почты и прочего.
    - title: Несколько платформ
      body: Приложение работает на Windows, Linux, Android и iOS. Серверы можно развернуть на Windows или Linux.
  how_kicker: Как идёт сообщение
