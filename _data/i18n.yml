    - n: "02"
      title: Ретрансляция
      body: Короткая цепочка узлов (не больше 1–3) снимает заголовок и передаёт пакет дальше.
    - n: "03"
      title: BLE
      body: Передача по Bluetooth Low Energy для того же сеанса, когда радио ближе, чем сеть.
    - n: "04"
      title: Сервер
      body: Если никто не отвечает, сервер держит запечатанное содержимое, пока вторая сторона его не заберёт. Серверы разворачиваются самостоятельно клиентами сети.
