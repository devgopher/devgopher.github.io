  features_kicker: Was es kann
  features_title: Mesh (and/or) server
  features:
    - title: Zuerst Peer-to-Peer
      body: Findet Peers im lokalen Netz per UDP und sendet direkt, wenn eine Adresse bekannt ist.
    - title: Kurzes Mesh
      body: Ohne direkte Route sucht TorgLink in einem kleinen Graphen — ein bis drei Hops — und kann über bereits vertrauenswürdige Knoten weiterleiten.
    - title: BLE, wenn es hilft
      body: Bluetooth Low Energy kann dieselben verschlüsselten Sitzungen über Funk tragen.
    - title: Undurchsichtig auf dem Server
      body: Der optionale HTTPS-Server speichert nur Ciphertext. Er leitet Blobs, Empfangsbestätigungen und Präsenz weiter. Chats liest er nicht.
    - title: Konto zuerst lokal
      body: Registrierung und Chats liegen auf dem Gerät. Kontakte kommen per QR-Code. Für die Identifikation sind weder Telefonnummer noch E-Mail oder Ähnliches nötig.
    - title: Plattformübergreifend
      body: Der Messenger läuft unter Windows, Linux, Android und iOS. Server können unter Windows oder Linux bereitgestellt werden.
  how_kicker: Wie eine Nachricht wandert
  how_title: Vier Wege, wie eine Nachricht sich bewegen kann.
  steps:
    - n: "01"
      title: Direkt
      body: Zuletzt bekannte UDP-Adresse, dasselbe LAN oder ein per QR gescannter Peer.
    - n: "02"
      title: Relay
      body: Eine kurze Kette von Knoten (max. 1–3 Hops) entfernt Hüllen und leitet das Paket weiter.
    - n: "03"
      title: BLE
      body: Bluetooth-Low-Energy-Transport für dieselbe Sitzung, wenn Funkreichweite das Netz schlägt.
    - n: "04"
      title: Server
      body: Ist niemand erreichbar, behält der Server die versiegelte Nutzlast, bis die andere Seite abruft. Server werden von den Clients des Netzwerks eigenständig bereitgestellt.
  platforms_kicker: Plattformen
  platforms_title: Verfügbar auf diesen Plattformen
  platforms_note: Wir wollen ein breites Spektrum an Geräten unterstützen, auch solche, die heute als veraltet gelten (Windows 7).
  platforms:
    - name: Windows
      detail: Client, einschließlich Windows 7. Hier kann auch ein Server gehostet werden.
    - name: Linux
      detail: Client. Hier kann auch ein Server gehostet werden.
    - name: Android
      detail: Client.
    - name: iOS
      detail: Client.
