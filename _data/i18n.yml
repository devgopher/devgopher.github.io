  server_points:
    - title: Поиск клиентов
      body: Помогает находить участников, когда прямого маршрута по ячеистой сети нет.
    - title: Только шифротекст
      body: На сервере сообщения живут только как шифротекст. Переписку он не читает.
    - title: Удаление после получения
      body: Как только вторая сторона получила сообщение, оно удаляется безвозвратно.
