# Homepage news. Add new entries at the top. Body is Markdown (links, emphasis).
- date: "2026-09-28"
  title:
    en: First TorgLink release
    ru: Первый релиз TorgLink
    de: Erste TorgLink-Version
    fr: Première version de TorgLink
    es: Primer lanzamiento de TorgLink
    zh: TorgLink 首个版本
  body:
    en: |
      We are pleased to present the first release of the TorgLink messenger ([TorgLink.MAUI release artifacts](https://github.com/IskraMessenger/Iskra.MAUI/releases/tag/ci-builds)). This version implements sending and receiving of messages and media (images, documents, voice messages) both over mesh (though a great deal of work remains to stabilize it) and via self-hosted servers ([ShortP2P server release artifacts](https://github.com/IskraMessenger/ShortP2P/actions/runs/36399809396#artifacts)). Encryption is point-to-point; personal data (except nick and networkId) is stored locally only. Conversations are also stored either locally or temporarily on the server in encrypted form (the encrypted message is deleted when the recipient receives it).

      **ATTENTION!** We need help with testing and development! If you want to take part, you are welcome in the [Issues](https://github.com/IskraMessenger/Iskra.MAUI/issues) section on GitHub, or write to [botticellibots@gmail.com](mailto:botticellibots@gmail.com)!
    ru: |
      Рады представить первый релиз мессенджера TorgLink ([артефакты релиза TorgLink.MAUI](https://github.com/IskraMessenger/Iskra.MAUI/releases/tag/ci-builds)). В текущей версии реализованы передача и приём сообщений и мультимедиа (изображения, документы, голосовые сообщения) как посредством mesh (хотя предстоит большая работа по стабилизации), так и посредством самостоятельно разворачиваемых серверов ([артефакты релиза ShortP2P server](https://github.com/IskraMessenger/ShortP2P/actions/runs/36399809396#artifacts)). Шифрование point-to-point; личные данные (за исключением ника и networkId) хранятся только локально. Переписка также хранится либо локально, либо временно на сервере в зашифрованном виде (зашифрованное сообщение удаляется при получении получателем).

      **ВНИМАНИЕ!** Нужна помощь в тестировании и разработке! Кто хочет участвовать — добро пожаловать в раздел [Issues](https://github.com/IskraMessenger/Iskra.MAUI/issues) на GitHub, либо пишите на почту [botticellibots@gmail.com](mailto:botticellibots@gmail.com)!
    de: |
      Wir freuen uns, die erste Version des TorgLink-Messengers vorzustellen ([TorgLink.MAUI-Release-Artefakte](https://github.com/IskraMessenger/Iskra.MAUI/releases/tag/ci-builds)). In der aktuellen Version sind Senden und Empfangen von Nachrichten und Multimedia (Bilder, Dokumente, Sprachnachrichten) sowohl über Mesh realisiert (obwohl noch viel Arbeit zur Stabilisierung bevorsteht) als auch über selbst betriebene Server ([ShortP2P-Server-Release-Artefakte](https://github.com/IskraMessenger/ShortP2P/actions/runs/36399809396#artifacts)). Die Verschlüsselung ist point-to-point; personenbezogene Daten (mit Ausnahme von Nick und networkId) werden nur lokal gespeichert. Der Chatverlauf wird ebenfalls entweder lokal oder vorübergehend verschlüsselt auf dem Server gespeichert (die verschlüsselte Nachricht wird gelöscht, sobald der Empfänger sie erhalten hat).

      **ACHTUNG!** Wir brauchen Hilfe beim Testen und bei der Entwicklung! Wer mitmachen möchte — herzlich willkommen im Bereich [Issues](https://github.com/IskraMessenger/Iskra.MAUI/issues) auf GitHub, oder schreiben Sie an [botticellibots@gmail.com](mailto:botticellibots@gmail.com)!
    fr: |
      Nous sommes heureux de présenter la première version de la messagerie TorgLink ([artefacts de la version TorgLink.MAUI](https://github.com/IskraMessenger/Iskra.MAUI/releases/tag/ci-builds)). Cette version permet d’envoyer et de recevoir des messages et des médias (images, documents, messages vocaux) à la fois via le mesh (même s’il reste beaucoup de travail pour le stabiliser) et via des serveurs que vous déployez vous-même ([artefacts de la version du serveur ShortP2P](https://github.com/IskraMessenger/ShortP2P/actions/runs/36399809396#artifacts)). Le chiffrement est point-to-point ; les données personnelles (à l’exception du pseudo et du networkId) sont stockées uniquement en local. La correspondance est également stockée soit en local, soit temporairement sur le serveur sous forme chiffrée (le message chiffré est supprimé à la réception par le destinataire).

      **ATTENTION !** Nous avons besoin d’aide pour les tests et le développement ! Si vous voulez participer, rendez-vous dans la section [Issues](https://github.com/IskraMessenger/Iskra.MAUI/issues) sur GitHub, ou écrivez à [botticellibots@gmail.com](mailto:botticellibots@gmail.com) !
    es: |
      Nos complace presentar la primera versión del mensajero TorgLink ([artefactos del lanzamiento de TorgLink.MAUI](https://github.com/IskraMessenger/Iskra.MAUI/releases/tag/ci-builds)). En la versión actual están implementados el envío y la recepción de mensajes y multimedia (imágenes, documentos, mensajes de voz) tanto a través de mesh (aunque queda mucho trabajo de estabilización) como mediante servidores desplegados por cuenta propia ([artefactos del lanzamiento del servidor ShortP2P](https://github.com/IskraMessenger/ShortP2P/actions/runs/36399809396#artifacts)). El cifrado es point-to-point; los datos personales (salvo el nick y el networkId) se guardan solo en local. La conversación también se guarda o en local o temporalmente en el servidor de forma cifrada (el mensaje cifrado se elimina al ser recibido por el destinatario).

      **¡ATENCIÓN!** ¡Hace falta ayuda con las pruebas y el desarrollo! Quien quiera participar, bienvenido a la sección [Issues](https://github.com/IskraMessenger/Iskra.MAUI/issues) en GitHub, o escriba a [botticellibots@gmail.com](mailto:botticellibots@gmail.com)!
    zh: |
      很高兴推出即时通讯应用 TorgLink 的首个版本（[TorgLink.MAUI 发布产物](https://github.com/IskraMessenger/Iskra.MAUI/releases/tag/ci-builds)）。当前版本已实现消息与多媒体（图片、文档、语音）的发送与接收，既可通过 mesh（尽管稳定化仍有大量工作），也可通过自行部署的服务器（[ShortP2P server 发布产物](https://github.com/IskraMessenger/ShortP2P/actions/runs/36399809396#artifacts)）。加密为 point-to-point；个人数据（昵称与 networkId 除外）仅保存在本地。聊天记录也保存在本地，或暂时以加密形式存放在服务器上（加密消息在接收方收到后即删除）。

      **注意！** 我们需要测试与开发方面的帮助！想参与的朋友，欢迎前往 GitHub 的 [Issues](https://github.com/IskraMessenger/Iskra.MAUI/issues) 栏目，或发邮件至 [botticellibots@gmail.com](mailto:botticellibots@gmail.com)！
